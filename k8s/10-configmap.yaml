# Non-secret configuration. Two pieces:
#  1) lead-engine-env: non-secret env values (placeholder sheet id + notify addresses).
#  2) lead-engine-config: the per-region runner config files, mounted as a volume.
# All values here are placeholders. Real secrets live in the Secret, never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lead-engine-env
  namespace: lead-engine
  labels:
    app.kubernetes.io/name: lead-engine
data:
  GOOGLE_SHEET_ID: "placeholder-spreadsheet-id"
  NOTIFY_TO: "operator@example.com"
  NOTIFY_FROM: "lead-engine@example.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lead-engine-config
  namespace: lead-engine
  labels:
    app.kubernetes.io/name: lead-engine
data:
  region-one.json: |
    {
      "region": "region-one",
      "segments": [
        { "segment": "placeholder-segment-a", "query": "placeholder segment a businesses near region", "min_score": 7 },
        { "segment": "placeholder-segment-b", "query": "placeholder segment b businesses near region", "min_score": 7 },
        { "segment": "placeholder-segment-c", "query": "placeholder segment c businesses near region", "min_score": 6 }
      ],
      "scoring": { "model": "claude-haiku-4-5-20251001", "max_tokens": 1024, "min_score_default": 7 },
      "sheets": { "tab_qualified": "Qualified", "tab_low_score": "LowScore" },
      "notify": { "subject_prefix": "[Lead Engine]" },
      "limits": { "max_results_per_segment": 20, "audit_char_limit": 2500, "request_timeout_ms": 30000, "max_retries": 3 },
      "region_filter": ["region one"]
    }
  region-two.json: |
    {
      "region": "region-two",
      "segments": [
        { "segment": "placeholder-segment-a", "query": "placeholder segment a businesses near region", "min_score": 7 },
        { "segment": "placeholder-segment-b", "query": "placeholder segment b businesses near region", "min_score": 7 },
        { "segment": "placeholder-segment-c", "query": "placeholder segment c businesses near region", "min_score": 6 }
      ],
      "scoring": { "model": "claude-haiku-4-5-20251001", "max_tokens": 1024, "min_score_default": 7 },
      "sheets": { "tab_qualified": "Qualified", "tab_low_score": "LowScore" },
      "notify": { "subject_prefix": "[Lead Engine]" },
      "limits": { "max_results_per_segment": 20, "audit_char_limit": 2500, "request_timeout_ms": 30000, "max_retries": 3 },
      "region_filter": ["region two"]
    }
