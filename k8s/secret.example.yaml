# TEMPLATE ONLY. Do not apply this file with real values committed.
#
# The real Secret is created at deploy time from your gitignored .env, using
# scripts/create-secret.ps1 (Windows) or scripts/create-secret.sh (Linux/macOS).
# This file documents the shape of the Secret the CronJobs expect.
#
# The CronJobs reference this Secret with optional: true, so --dry-run pods run
# fine even when it does not exist. It is only needed for live (non-dry-run) runs.
apiVersion: v1
kind: Secret
metadata:
  name: lead-engine-secrets
  namespace: lead-engine
  labels:
    app.kubernetes.io/name: lead-engine
type: Opaque
stringData:
  APIFY_TOKEN: "replace-with-apify-token"
  FIRECRAWL_API_KEY: "replace-with-firecrawl-key"
  ANTHROPIC_API_KEY: "replace-with-anthropic-key"
  GOOGLE_ACCESS_TOKEN: "replace-with-google-oauth-access-token"
