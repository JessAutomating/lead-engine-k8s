# Region one batch. Source schedule: Monday 12:00 am -> cron "0 0 * * 1".
#
# Ships in --dry-run so applying this to any cluster is safe and needs no secrets.
# To run live: populate the Secret (scripts/create-secret.*) and remove "--dry-run"
# from args below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lead-engine-region-one
  namespace: lead-engine
  labels:
    app.kubernetes.io/name: lead-engine
    region: region-one
spec:
  schedule: "0 0 * * 1"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lead-engine
            region: region-one
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runner
              image: lead-engine-k8s:0.1.0
              imagePullPolicy: IfNotPresent
              args: ["--dry-run", "--config", "/config/region-one.json"]
              envFrom:
                - configMapRef:
                    name: lead-engine-env
                - secretRef:
                    name: lead-engine-secrets
                    optional: true
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: config
              configMap:
                name: lead-engine-config
            - name: tmp
              emptyDir: {}
